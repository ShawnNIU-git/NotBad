[project]
name = "notbad-recog"
version = "0.1.0"
description = "NotBad 识别原型：试卷照片 -> 切题 + 判错，并提供评测脚本"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
notbad-recog = "notbad_recog.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["notbad_recog*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
